<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camille Fascino — Persevere</title>
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --primary: #5E1818;
            --secondary: #1A2A4A;
            --white: #ffffff;
            --off-white: #f8f8f8;
            --light-gray: #e8e8e8;
            --text: #1a1a1a;
            --text-light: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--white);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        /* ──── HEADER ──── */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--white);
            border-bottom: 1px solid var(--light-gray);
            padding: 20px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .brand-name {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary);
            text-decoration: none;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }

        .brand-name:hover {
            opacity: 0.7;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .cart-toggle {
            background: transparent;
            border: 1px solid var(--text);
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text);
            padding: 8px 16px;
            transition: all 0.3s;
            position: relative;
            font-weight: 400;
        }

        .cart-toggle:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        /* ──── MAIN CONTENT ──── */
        main {
            margin-top: 0;
            min-height: calc(100vh - 70px);
            padding: 80px 5% 60px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ──── INTRO SECTION ──── */
        .intro {
            max-width: 100%;
            margin-bottom: 100px;
            text-align: left;
        }

        .intro-subtitle {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .intro-title {
            font-family: 'Courier Prime', monospace;
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 30px;
            color: var(--text);
            font-weight: 400;
            letter-spacing: 1px;
        }

        .intro-text {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-light);
            margin-bottom: 0;
            max-width: 500px;
        }

        .intro-text em {
            font-style: italic;
            color: var(--primary);
        }

        /* ──── GRID ──── */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
            margin-bottom: 60px;
            margin-top: 80px;
        }

        .product-card {
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            opacity: 0.8;
        }

        .product-image-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: var(--off-white);
            margin-bottom: 20px;
            position: relative;
        }

        .product-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-image-wrap img {
            transform: scale(1.02);
        }

        .product-info {
            flex: 1;
        }

        .product-label {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .product-desc {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 13px;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* ──── LIGHTBOX ──── */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lightbox-overlay.open {
            display: flex;
        }

        .lightbox-content {
            background: white;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 50px;
            padding: 50px;
            position: relative;
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
            opacity: 0.6;
            transition: opacity 0.3s;
            font-weight: 300;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .lightbox-gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lightbox-main-img {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background: var(--off-white);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-main-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lightbox-thumbnails {
            display: flex;
            gap: 10px;
        }

        .lightbox-thumb {
            width: 80px;
            height: 80px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--light-gray);
            background: var(--off-white);
            transition: all 0.3s;
        }

        .lightbox-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lightbox-thumb.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .lightbox-thumb:hover {
            border-color: var(--primary);
        }

        .lightbox-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: 10px;
        }

        .lightbox-title {
            font-family: 'Courier Prime', monospace;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 20px;
            color: var(--text);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .lightbox-description {
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .product-options {
            margin-bottom: 30px;
        }

        .option-group {
            margin-bottom: 25px;
        }

        .option-label {
            display: block;
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .option-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: transparent;
            border: 1px solid var(--light-gray);
            color: var(--text);
            padding: 10px 18px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-weight: 400;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
        }

        .option-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .lightbox-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-add-cart {
            background: var(--primary);
            border: none;
            color: white;
            padding: 14px 30px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Courier Prime', monospace;
            text-align: center;
        }

        .btn-add-cart:hover {
            background: var(--secondary);
        }

        .btn-add-cart:active {
            opacity: 0.9;
        }

        /* ──── CART SIDEBAR ──── */
        .cart-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            background: white;
            border-left: 1px solid var(--light-gray);
            z-index: 1500;
            transform: translateX(100%);
            transition: transform 0.4s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cart-sidebar.open {
            transform: translateX(0);
        }

        .cart-header {
            padding: 30px;
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-family: 'Courier Prime', monospace;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text);
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .cart-close:hover {
            opacity: 1;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--light-gray);
        }

        .cart-item-image {
            width: 70px;
            height: 70px;
            background: var(--off-white);
            flex-shrink: 0;
            overflow: hidden;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cart-item-details {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .cart-item-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .cart-item-remove button {
            background: transparent;
            border: 1px solid var(--light-gray);
            color: var(--text-light);
            padding: 4px 12px;
            border-radius: 0;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Courier Prime', monospace;
        }

        .cart-item-remove button:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .cart-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            font-size: 13px;
        }

        .cart-footer {
            padding: 30px;
            border-top: 1px solid var(--light-gray);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-checkout {
            background: var(--primary);
            border: none;
            color: white;
            padding: 14px 30px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Courier Prime', monospace;
        }

        .btn-checkout:hover {
            background: var(--secondary);
        }

        .btn-checkout:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ──── FOOTER ──── */
        footer {
            margin-top: 80px;
            padding: 50px 5%;
            background: var(--off-white);
            border-top: 1px solid var(--light-gray);
            text-align: center;
            color: var(--text-light);
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        footer a:hover {
            opacity: 0.7;
        }

        /* ──── RESPONSIVE ──── */
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .intro-title {
                font-size: 32px;
            }

            .lightbox-content {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 30px;
            }

            .cart-sidebar {
                width: 100%;
            }

            .nav-links {
                display: none;
            }

            header {
                padding: 16px 5%;
                height: auto;
            }

            main {
                padding: 60px 5% 40px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <a href="/" class="brand-name">Camille Fascino</a>
        <div class="header-actions">
            <nav class="nav-links">
                <a href="#products">Shop</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
            <button class="cart-toggle" onclick="toggleCart()">
                Cart
                <span class="cart-count" id="cartCount" style="display: none;">0</span>
            </button>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <!-- INTRO -->
        <section class="intro">
            <div class="intro-subtitle">Drop 1</div>
            <h1 class="intro-title">Persevere</h1>
            <p class="intro-text">
                Movement. Intention. Faith. Three pieces, one philosophy. <em>Ardere, Enjoy Life, Persevere.</em>
            </p>
        </section>

        <!-- PRODUCTS GRID -->
        <div class="products-grid" id="productsGrid"></div>
    </main>

    <!-- LIGHTBOX -->
    <div class="lightbox-overlay" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">×</button>
            
            <div class="lightbox-gallery">
                <div class="lightbox-main-img">
                    <img id="lightboxMainImg" src="" alt="">
                </div>
                <div class="lightbox-thumbnails" id="lightboxThumbs"></div>
            </div>

            <div class="lightbox-info">
                <div>
                    <h2 class="lightbox-title" id="lightboxTitle"></h2>
                    <p class="lightbox-description" id="lightboxDesc"></p>
                    
                    <div class="product-options">
                        <div class="option-group">
                            <label class="option-label">Size</label>
                            <div class="option-buttons" id="sizeOptions"></div>
                        </div>
                    </div>
                </div>

                <div class="lightbox-actions">
                    <button class="btn-add-cart" onclick="addToCart()" id="addCartBtn">Add to Cart • €39</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CART SIDEBAR -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="cart-close" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span id="cartTotal">€0</span>
            </div>
            <button class="btn-checkout" onclick="goToCheckout()" id="checkoutBtn">Checkout</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Camille Fascino. Hand-designed in Chambéry. <a href="#">Instagram</a></p>
    </footer>

    <!-- SCRIPTS -->
    <script src="camille-catalogue.js"></script>
    <script>
        let cart = [];
        let currentProduct = null;
        let currentSize = null;

        // Render products grid - limited to 3 items
        function renderGrid() {
            const grid = document.getElementById('productsGrid');
            const designs = DESIGNS.slice(0, 3); // Only first 3 products
            grid.innerHTML = designs.map(design => `
                <div class="product-card" onclick="openLightbox('${design.key}')">
                    <div class="product-image-wrap">
                        <img src="/images/${coverImg(design.key)}" alt="${design.label}">
                    </div>
                    <div class="product-info">
                        <div class="product-label">${design.label}</div>
                        <p class="product-desc">${design.description.replace(/<br>/g, ' ')}</p>
                        <div class="product-price">€39</div>
                    </div>
                </div>
            `).join('');
        }

        // Open lightbox
        function openLightbox(designKey) {
            currentProduct = DESIGNS.find(d => d.key === designKey);
            if (!currentProduct) return;

            document.getElementById('lightboxTitle').textContent = currentProduct.label;
            document.getElementById('lightboxDesc').innerHTML = currentProduct.description;
            
            // Main image
            const mainImg = document.getElementById('lightboxMainImg');
            mainImg.src = `/images/${currentProduct.images[0]}`;

            // Thumbnails
            const thumbsHtml = currentProduct.images.map((img, i) => `
                <div class="lightbox-thumb ${i === 0 ? 'active' : ''}" onclick="switchImage('${img}', this)">
                    <img src="/images/${img}" alt="">
                </div>
            `).join('');
            document.getElementById('lightboxThumbs').innerHTML = thumbsHtml;

            // Size options
            const sizesHtml = SIZES.map(size => `
                <button class="option-btn ${size === 'M' ? 'active' : ''}" onclick="selectSize(this, '${size}')">${size}</button>
            `).join('');
            document.getElementById('sizeOptions').innerHTML = sizesHtml;
            currentSize = 'M';

            document.getElementById('lightbox').classList.add('open');
        }

        // Close lightbox
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
            currentProduct = null;
        }

        // Switch image
        function switchImage(imgName, element) {
            document.getElementById('lightboxMainImg').src = `/images/${imgName}`;
            document.querySelectorAll('.lightbox-thumb').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }

        // Select size
        function selectSize(element, size) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentSize = size;
        }

        // Add to cart
        function addToCart() {
            if (!currentProduct || !currentSize) return;

            const item = {
                id: currentProduct.id,
                design: currentProduct.label,
                size: currentSize,
                price: 39,
                image: currentProduct.images[0]
            };

            cart.push(item);
            updateCart();
            closeLightbox();
        }

        // Remove from cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        // Update cart display
        function updateCart() {
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            const cartItems = document.getElementById('cartItems');

            cartCount.textContent = cart.length;
            cartCount.style.display = cart.length > 0 ? 'flex' : 'none';

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            cartTotal.textContent = '€' + total.toFixed(2);

            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
                return;
            }

            cartItems.innerHTML = cart.map((item, i) => `
                <div class="cart-item">
                    <div class="cart-item-image">
                        <img src="/images/${item.image}" alt="">
                    </div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.design}</div>
                        <div class="cart-item-details">Size: ${item.size}</div>
                        <div class="cart-item-price">€${item.price}</div>
                        <div class="cart-item-remove">
                            <button onclick="removeFromCart(${i})">Remove</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Toggle cart sidebar
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        // Checkout
        async function goToCheckout() {
            if (cart.length === 0) return;

            const btn = document.getElementById('checkoutBtn');
            btn.textContent = 'Loading...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: cart })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Checkout error');
                    btn.textContent = 'Checkout';
                    btn.disabled = false;
                    return;
                }

                window.location.href = data.url;
            } catch (err) {
                alert('Payment error');
                btn.textContent = 'Checkout';
                btn.disabled = false;
            }
        }

        // Close lightbox on overlay click
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Initialize
        renderGrid();
        updateCart();
    </script>

</body>
</html>
